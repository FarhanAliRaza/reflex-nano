[package]
name = "reflex-nano"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum = { version = "=0.8.4", features = ["json", "ws"] }
uuid = { version = "1", features = ["v4"] }
flate2 = "1"

[build-dependencies]
minify-js = "=0.6.0"
parse-js = "=0.20.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[[example]]
name = "dashboard"
path = "../../examples/rust/dashboard.rs"

[[example]]
name = "runner"
path = "../../examples/rust/runner.rs"

[[example]]
name = "react"
path = "../../examples/rust/react.rs"
